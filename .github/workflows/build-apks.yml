name: Build debug APKs manually

on:
  # GitLab builds development APKs automatically; this remains available on demand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Phone and Wear OS debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          # Match gradle/gradle-daemon-jvm.properties to avoid a second JDK download.
          distribution: jetbrains
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build debug APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :wear:assembleDebug

      - name: Name APKs by branch and commit
        id: package
        env:
          BUILD_REF: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          bash scripts/ci/package-debug-apks.sh "$BUILD_REF" "$BUILD_SHA"
          cat apk-artifacts/build.env >> "$GITHUB_OUTPUT"

      - name: Upload phone APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wearmux-phone-debug-${{ steps.package.outputs.build_id }}
          path: apk-artifacts/phone/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Wear OS APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wearmux-wear-debug-${{ steps.package.outputs.build_id }}
          path: apk-artifacts/wear/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
