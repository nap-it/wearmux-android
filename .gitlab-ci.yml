# Container executors use this image's Git and download utilities. Shell
# executors use the host utilities; both install their JDK/SDK in the workspace.
image: buildpack-deps:jammy-scm

stages:
  - build
  - release

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GIT_DEPTH: "0"

cache:
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - gradle/libs.versions.toml
  paths:
    - .android-sdk/
    - .ci-tools/temurin21/
    - .gradle/caches/
    - .gradle/jdks/
    - .gradle/wrapper/

debug-apks:
  stage: build
  timeout: 45 minutes
  rules:
    # A requested release backfill on main only publishes metadata and links.
    - if: '$RELEASE_TAG && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: never
    # Manual pipelines build the selected ref, regardless of the changed files.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # All development branches build on code pushes. Release tags are built
    # and signed by GitHub; documentation-only pushes skip compilation.
    - changes:
        paths:
          - app/**/*
          - wear/**/*
          - models/**/*
          - gradle/**/*
          - "*.gradle"
          - "*.gradle.kts"
          - gradle.properties
          - gradlew
          - gradlew.bat
          - scripts/ci/**/*
          - .gitlab-ci.yml
          - .gitattributes
          - .gitmodules
          - .github/workflows/release-apks.yml
      if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - when: never
  before_script:
    - |
      # Skip docs inside source directories before downloading the SDK. Rules
      # cannot exclude these extensions on every supported GitLab version.
      if [ "$CI_PIPELINE_SOURCE" = "push" ] && [ -z "${CI_COMMIT_TAG:-}" ] \
        && [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] \
        && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        if changed_files=$(git diff --name-only "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA"); then
          needs_build=false
          while IFS= read -r path; do
            case "$path" in
              *.md|*.pdf|LICENSE*|*/LICENSE*|NOTICE*|*/NOTICE*) continue ;;
            esac
            case "$path" in
              app/*|wear/*|models/*|gradle/*|scripts/ci/*|.gitlab-ci.yml|.gitattributes|.gitmodules|.github/workflows/release-apks.yml|gradle.properties|gradlew|gradlew.bat)
                needs_build=true; break ;;
              */*) ;;
              *.gradle|*.gradle.kts) needs_build=true; break ;;
            esac
          done <<< "$changed_files"
          if [ "$needs_build" = false ]; then
            echo 'No code or build changes; skipping APK build.'
            exit 0
          fi
        else
          echo 'Previous commit unavailable; building APKs.'
        fi
      fi
    - source scripts/ci/setup-android.sh
  script:
    - ./gradlew --no-daemon --stacktrace :app:assembleDebug :wear:assembleDebug
    - bash scripts/ci/package-debug-apks.sh "$CI_COMMIT_REF_NAME" "$CI_COMMIT_SHA"
  artifacts:
    name: "wearmux-debug-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    expire_in: 7 days
    when: always
    paths:
      - apk-artifacts/

codenap-release:
  stage: release
  timeout: 10 minutes
  resource_group: codenap-releases
  cache: []
  dependencies: []
  rules:
    # The version tag starts releases on CodeNap and reaches GitHub by mirroring.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    # Main can backfill an existing release via Run pipeline or a push option.
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RELEASE_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RELEASE_TAG'
    - when: never
  script:
    - python3 scripts/ci/release.py codenap --tag "${RELEASE_TAG:-$CI_COMMIT_TAG}"
