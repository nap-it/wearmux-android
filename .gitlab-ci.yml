image: eclipse-temurin:21-jdk-jammy

stages:
  - build

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GIT_DEPTH: "0"
  DEBIAN_FRONTEND: noninteractive

cache:
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - gradle/libs.versions.toml
  paths:
    - .android-sdk/
    - .gradle/caches/
    - .gradle/jdks/
    - .gradle/wrapper/

debug-apks:
  stage: build
  timeout: 45 minutes
  rules:
    # Web runs and tags are explicit requests, regardless of the changed files.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG'
    # Keep branch pushes aligned with the GitHub workflow: source/build changes
    # run the build, while documentation-only pushes do not.
    - changes:
        paths:
          - app/**/*
          - wear/**/*
          - models/**/*
          - gradle/**/*
          - "*.gradle"
          - "*.gradle.kts"
          - gradle.properties
          - gradlew
          - gradlew.bat
          - scripts/ci/**/*
          - .gitlab-ci.yml
          - .gitattributes
          - .gitmodules
          - .github/workflows/build-apks.yml
          - .github/workflows/release-apks.yml
      if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - when: never
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends curl git unzip ca-certificates
    - |
      # Skip docs inside source directories before downloading the SDK. Rules
      # cannot express GitHub's negative path patterns on every GitLab version.
      if [ "$CI_PIPELINE_SOURCE" = "push" ] && [ -z "${CI_COMMIT_TAG:-}" ] \
        && [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] \
        && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        if changed_files=$(git diff --name-only "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA"); then
          needs_build=false
          while IFS= read -r path; do
            case "$path" in
              *.md|*.pdf|LICENSE*|*/LICENSE*|NOTICE*|*/NOTICE*) continue ;;
            esac
            case "$path" in
              app/*|wear/*|models/*|gradle/*|scripts/ci/*|.gitlab-ci.yml|.gitattributes|.gitmodules|.github/workflows/build-apks.yml|.github/workflows/release-apks.yml|gradle.properties|gradlew|gradlew.bat)
                needs_build=true; break ;;
              */*) ;;
              *.gradle|*.gradle.kts) needs_build=true; break ;;
            esac
          done <<< "$changed_files"
          if [ "$needs_build" = false ]; then
            echo 'No code or build changes; skipping APK build.'
            exit 0
          fi
        else
          echo 'Previous commit unavailable; building APKs.'
        fi
      fi
    - mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    - |
      if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
        curl --fail --location --silent --show-error \
          https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
          --output /tmp/android-commandline-tools.zip
        echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/android-commandline-tools.zip' \
          | sha256sum --check --status
        rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest" /tmp/android-commandline-tools
        mkdir /tmp/android-commandline-tools
        unzip -q /tmp/android-commandline-tools.zip -d /tmp/android-commandline-tools
        mv /tmp/android-commandline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      fi
    - '"$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes) >/dev/null'
    - >-
      "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" platform-tools
      'platforms;android-36' 'build-tools;36.0.0'
  script:
    - ./gradlew --no-daemon --stacktrace :app:assembleDebug :wear:assembleDebug
    - bash scripts/ci/package-debug-apks.sh "$CI_COMMIT_REF_NAME" "$CI_COMMIT_SHA"
  artifacts:
    name: "wearmux-debug-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    expire_in: 30 days
    when: always
    paths:
      - apk-artifacts/
